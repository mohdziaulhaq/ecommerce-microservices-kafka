spring:
  application:
    name: order-service
  rabbitmq:
    #    container_name: naughty_cartwright
    host: localhost
    port: 5672
    username: guest
    password: guest
  datasource:
    url: jdbc:postgresql://localhost:5434/orderservicedb
    driver-class-name: org.postgresql.Driver
    username: admin_user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

server:
  port: 4001
  # port: 4008


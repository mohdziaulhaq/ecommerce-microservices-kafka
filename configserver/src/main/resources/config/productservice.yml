spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    driver-class-name: org.postgresql.Driver
    username: admin_user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always



server:
  port: 4000
  address: 0.0.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html


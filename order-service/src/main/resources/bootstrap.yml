product:
  service:
    url: ${PRODUCT_SERVICE_URL}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      # Fixed typo: "locahost" -> "localhost"
      default-zone: http://localhost:8761/eureka
logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7
management:
  endpoints:
    web:
      exposure:
        include: "*"